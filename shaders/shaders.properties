#-------------------------------------------------------------------------------
# performance profiles
#
# only the options listed here really cost frames: the shadow map (its size,
# its range and whether entities cast into it) and the screen space reflections
# (how far they are traced and how finely). everything else in this pack is
# visual only, so the profiles leave it alone.
#
# every profile sets every one of these options: a profile is a patch, not a
# snapshot, so a value missing from the list would simply be inherited from
# whatever was selected before. that is what made the old LOWEST show the
# resolution of the previous profile.
#
# MEDIUM matches the defaults in shader.h, so it is also the state of a fresh
# install, and the pack starts there.
#
#                              LOW           MEDIUM        HIGH
#   shadowMapResolution        512           1024          2048      vram + raster
#   shadowDistance             64.0          128.0         256.0     shadowed chunks
#   SHADOW_ENTITY              -1 (none)     1 (all)       1 (all)   entity shadows
#   entityShadowDistanceMul    0.25          0.25          0.25      entity range
#   COLORED_SHADOWS            0 (none)      1 (grey)      2 (coloured)  translucent shadows
#   BLOCK_REFLECTIONS          0 (off)       5             5         block ssr
#   WATER_REFLECTION_STRENGTH  0 (off)       5             5         water ssr
#   SSR_MAX_STEPS              4             10            20        ray length
#   SSR_STEP_SIZE              2.0           1.5           1.0       ray accuracy
#   SSR_BINARY_STEPS           1             4             8         hit refinement
#
# COLORED_SHADOWS has three modes, and the three profiles each pick a different
# one: LOW 0 skips translucent casters (only opaque geometry casts), MEDIUM 1
# renders them as a neutral grey shadow, HIGH 2 renders them with the block's
# own colour. the defaults in shader.h match MEDIUM, so a fresh install is 1.
#
# shadows stay enabled in all three profiles, LOW just makes them much cheaper;
# turn ENABLE_SHADOWS off in the settings to drop the pass entirely.
# set 0 on both reflection options and the screen space reflections are skipped
# altogether, which is where most of the LOW saving comes from. HIGH keeps the
# same reflection strength as MEDIUM and only spends more on the trace itself.
#-------------------------------------------------------------------------------
profile.LOW=shadowMapResolution=512 shadowDistance=64.0 SHADOW_ENTITY=-1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=0 BLOCK_REFLECTIONS=0 WATER_REFLECTION_STRENGTH=0 SSR_MAX_STEPS=4 SSR_STEP_SIZE=2.0 SSR_BINARY_STEPS=1
profile.MEDIUM=shadowMapResolution=1024 shadowDistance=128.0 SHADOW_ENTITY=1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=1 BLOCK_REFLECTIONS=5 WATER_REFLECTION_STRENGTH=5 SSR_MAX_STEPS=10 SSR_STEP_SIZE=1.5 SSR_BINARY_STEPS=4
profile.HIGH=shadowMapResolution=2048 shadowDistance=256.0 SHADOW_ENTITY=1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=2 BLOCK_REFLECTIONS=5 WATER_REFLECTION_STRENGTH=5 SSR_MAX_STEPS=20 SSR_STEP_SIZE=1.0 SSR_BINARY_STEPS=8

#-------------------------------------------------------------------------------
# settings menu layout
#
# the main screen keeps its original shape: <profile> sits alone in the top
# left and the five page buttons line up down the right column. every sub-screen
# below is pinned to two columns: Iris switches to three by itself when a page
# gets long, which would break the left/right split. entries fill row-major
# (left, right, then the next row), so a screen holding one group in the left
# column and another in the right has to interleave the two and pad the shorter
# side with <empty>.
#-------------------------------------------------------------------------------
screen=<profile> [SHADOWS_SCREEN] <empty> [REFLECTIONS_SCREEN] <empty> [WATER_SCREEN] <empty> [ATMOSPHERE_SCREEN] <empty> [OTHER_SCREEN]

# light & shadow: lighting on the left, shadows on the right
screen.SHADOWS_SCREEN=LIGHT_BRIGHTNESS ENABLE_SHADOWS FLAT_LIGHTING COLORED_SHADOWS sunPathRotation SHADOW_ENTITY <empty> shadowDistance <empty> entityShadowDistanceMul <empty> shadowMapResolution <empty> SHADOW_PIXEL
screen.SHADOWS_SCREEN.columns=2

# reflections: left untouched
screen.REFLECTIONS_SCREEN=WATER_REFLECTION_STRENGTH BLOCK_REFLECTIONS SSR_STEP_SIZE SSR_MAX_STEPS <empty> SSR_BINARY_STEPS

# water: brightness / opacity / colour on the left, waves / glint on the right
screen.WATER_SCREEN=WATER_BRIGHTNESS WATER_WAVE_SIZE WATER_A WATER_WAVE_SPEED WATER_SATURATION WATER_GLINT_CUTOFF <empty> WATER_MIN_GLINT <empty> WATER_GLINT_BRIGHTNESS
screen.WATER_SCREEN.columns=2

# environment: sky & clouds on the left, fog then end stars on the right
screen.ATMOSPHERE_SCREEN=ENABLE_SKY ENABLE_FOG WEATHER_OPACITY OVERWORLD_FOG_MIN_SLIDER CLOUD_SUN_TINT OVERWORLD_FOG_MAX_SLIDER CLOUD_LIGHT_GAIN END_STARS_SPEED CLOUD_SILVER_LINING END_STARS_AMOUNT CLOUD_WEATHER_DARKNESS END_STARS_OPACITY
screen.ATMOSPHERE_SCREEN.columns=2

# other: every entry in the left column
screen.OTHER_SCREEN=GLOWING_ORES <empty> NETHER_COLOR_GRADING <empty> HAND_DYNAMIC_LIGHTING <empty>
screen.OTHER_SCREEN.columns=2

sliders=LIGHT_BRIGHTNESS WATER_BRIGHTNESS WATER_SATURATION WATER_A shadowDistance OVERWORLD_FOG_MIN_SLIDER OVERWORLD_FOG_MAX_SLIDER shadowMapResolution SHADOW_PIXEL WATER_REFLECTION_STRENGTH WATER_MIN_GLINT WATER_WAVE_SIZE WATER_WAVE_SPEED entityShadowDistanceMul sunPathRotation END_STARS_SPEED END_STARS_AMOUNT END_STARS_OPACITY WEATHER_OPACITY SSR_MAX_STEPS SSR_STEP_SIZE SSR_BINARY_STEPS BLOCK_REFLECTIONS WATER_GLINT_CUTOFF WATER_GLINT_BRIGHTNESS CLOUD_SUN_TINT CLOUD_LIGHT_GAIN CLOUD_SILVER_LINING CLOUD_WEATHER_DARKNESS

oldHandLight=true
separateAo=true
beacon.beam.depth=true
rain.depth=false
particles.ordering=mixed
occlusion.culling=true
oldLighting=false

#if SHADOW_ENTITY >= 1 || (!defined IS_IRIS && SHADOW_ENTITY >= 0)
shadowEntities=true
shadowBlockEntities=true
#else
shadowEntities=false
shadowBlockEntities=false
#endif

#if SHADOW_ENTITY >= 0
shadowPlayer=true
#else
shadowPlayer=false
#endif

iris.features.optional=BLOCK_EMISSION_ATTRIBUTE

#if MC_VERSION < 12111
program.world-1/gbuffers_line.enabled=false
program.world0/gbuffers_line.enabled=false
program.world1/gbuffers_line.enabled=false
#endif

#if MC_VERSION < 11700 || !defined IS_IRIS || !defined ENABLE_SKY
program.world0/gbuffers_clouds.enabled=false
program.world0/gbuffers_skybasic.enabled=false
#endif