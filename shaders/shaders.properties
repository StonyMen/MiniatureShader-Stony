#-------------------------------------------------------------------------------
# performance profiles
#
# only the options listed here really cost frames: the shadow map (its size,
# its range and whether entities cast into it) and the screen space reflections
# (how far they are traced and how finely). everything else in this pack is
# visual only, so the profiles leave it alone.
#
# every profile sets every one of these options: a profile is a patch, not a
# snapshot, so a value missing from the list would simply be inherited from
# whatever was selected before. that is what made the old LOWEST show the
# resolution of the previous profile.
#
# MEDIUM matches the defaults in shader.h, so it is also the state of a fresh
# install, and the pack starts there.
#
#                              LOW           MEDIUM        HIGH
#   shadowMapResolution        512           1024          2048      vram + raster
#   shadowDistance             64.0          128.0         256.0     shadowed chunks
#   SHADOW_ENTITY              -1 (none)     1 (all)       1 (all)   entity shadows
#   entityShadowDistanceMul    0.25          0.25          0.25      entity range
#   COLORED_SHADOWS            0 (none)      1 (grey)      2 (coloured)  translucent shadows
#   BLOCK_REFLECTIONS          0 (off)       5             5         block ssr
#   WATER_REFLECTION_STRENGTH  0 (off)       5             5         water ssr
#   SSR_MAX_STEPS              4             10            32        ray length
#   SSR_STEP_SIZE              2.0           1.6           1.0       ray accuracy
#   SSR_BINARY_STEPS           1             4             8         hit refinement
#
# COLORED_SHADOWS has three modes, and the three profiles each pick a different
# one: LOW 0 skips translucent casters (only opaque geometry casts), MEDIUM 1
# renders them as a neutral grey shadow, HIGH 2 renders them with the block's
# own colour. the defaults in shader.h match MEDIUM, so a fresh install is 1.
#
# shadows stay enabled in all three profiles, LOW just makes them much cheaper;
# turn ENABLE_SHADOWS off in the settings to drop the pass entirely.
# set 0 on both reflection options and the screen space reflections are skipped
# altogether, which is where most of the LOW saving comes from. HIGH keeps the
# same reflection strength as MEDIUM and only spends more on the trace itself.
#-------------------------------------------------------------------------------
profile.LOW=shadowMapResolution=512 shadowDistance=64.0 SHADOW_ENTITY=-1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=0 BLOCK_REFLECTIONS=0 WATER_REFLECTION_STRENGTH=0 SSR_MAX_STEPS=4 SSR_STEP_SIZE=2.0 SSR_BINARY_STEPS=1
profile.MEDIUM=shadowMapResolution=1024 shadowDistance=128.0 SHADOW_ENTITY=1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=1 BLOCK_REFLECTIONS=5 WATER_REFLECTION_STRENGTH=5 SSR_MAX_STEPS=10 SSR_STEP_SIZE=1.6 SSR_BINARY_STEPS=4
profile.HIGH=shadowMapResolution=2048 shadowDistance=256.0 SHADOW_ENTITY=1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=2 BLOCK_REFLECTIONS=5 WATER_REFLECTION_STRENGTH=5 SSR_MAX_STEPS=32 SSR_STEP_SIZE=1.0 SSR_BINARY_STEPS=8

screen=<profile> [SHADOWS_SCREEN] <empty> [REFLECTIONS_SCREEN] <empty> [WATER_SCREEN] <empty> [ATMOSPHERE_SCREEN] <empty> [COLORS_SCREEN] <empty> [OTHER_SCREEN]

screen.REFLECTIONS_SCREEN=WATER_REFLECTION_STRENGTH BLOCK_REFLECTIONS SSR_STEP_SIZE SSR_MAX_STEPS <empty> SSR_BINARY_STEPS
screen.WATER_SCREEN=WATER_WAVE_SIZE WATER_BRIGHTNESS WATER_WAVE_SPEED WATER_SATURATION <empty> WATER_A <empty> <empty> <empty> WATER_MIN_GLINT <empty> WATER_GLINT_CUTOFF <empty> WATER_GLINT_BRIGHTNESS
screen.COLORS_SCREEN=TORCH_INNER_R TORCH_MIDDLE_R TORCH_OUTER_R TORCH_INNER_G TORCH_MIDDLE_G TORCH_OUTER_G TORCH_INNER_B TORCH_MIDDLE_B TORCH_OUTER_B <empty> <empty> <empty> <empty> <empty> MOON_R <empty> <empty> MOON_G <empty> <empty> MOON_B
screen.COLORS_SCREEN.columns=3
screen.ATMOSPHERE_SCREEN=ENABLE_SKY WEATHER_OPACITY ENABLE_FOG OVERWORLD_FOG_MIN_SLIDER <empty> OVERWORLD_FOG_MAX_SLIDER <empty> CLOUD_SUN_TINT CLOUD_LIGHT_GAIN <empty> CLOUD_SILVER_LINING CLOUD_WEATHER_DARKNESS <empty> END_STARS_SPEED <empty> END_STARS_AMOUNT <empty> END_STARS_OPACITY
screen.SHADOWS_SCREEN=ENABLE_SHADOWS FLAT_LIGHTING SHADOW_ENTITY sunPathRotation <empty> <empty> shadowDistance LIGHT_BRIGHTNESS shadowMapResolution SHADOW_DARKNESS shadowIntervalSize SHADOW_BLUENESS entityShadowDistanceMul SHADOW_PIXEL COLORED_SHADOWS
screen.OTHER_SCREEN=<empty> HAND_DYNAMIC_LIGHTING <empty> GLOWING_ORES <empty> HIGHLIGHT_WAXED <empty> NETHER_COLOR_GRADING

sliders=LIGHT_BRIGHTNESS SHADOW_DARKNESS WATER_BRIGHTNESS WATER_SATURATION WATER_A TORCH_INNER_R TORCH_INNER_G TORCH_INNER_B TORCH_MIDDLE_R TORCH_MIDDLE_G TORCH_MIDDLE_B TORCH_OUTER_R TORCH_OUTER_G TORCH_OUTER_B shadowDistance OVERWORLD_FOG_MIN_SLIDER OVERWORLD_FOG_MAX_SLIDER SHADOW_BLUENESS shadowMapResolution SHADOW_PIXEL WATER_REFLECTION_STRENGTH WATER_MIN_GLINT WATER_WAVE_SIZE WATER_WAVE_SPEED shadowIntervalSize entityShadowDistanceMul sunPathRotation MOON_R MOON_G MOON_B END_STARS_SPEED END_STARS_AMOUNT END_STARS_OPACITY WEATHER_OPACITY SSR_MAX_STEPS SSR_STEP_SIZE SSR_BINARY_STEPS BLOCK_REFLECTIONS WATER_GLINT_CUTOFF WATER_GLINT_BRIGHTNESS CLOUD_SUN_TINT CLOUD_LIGHT_GAIN CLOUD_SILVER_LINING CLOUD_WEATHER_DARKNESS

oldHandLight=true
separateAo=true
beacon.beam.depth=true
rain.depth=false
particles.ordering=mixed
occlusion.culling=true
oldLighting=false

#if SHADOW_ENTITY >= 1 || (!defined IS_IRIS && SHADOW_ENTITY >= 0)
shadowEntities=true
shadowBlockEntities=true
#else
shadowEntities=false
shadowBlockEntities=false
#endif

#if SHADOW_ENTITY >= 0
shadowPlayer=true
#else
shadowPlayer=false
#endif

iris.features.optional=BLOCK_EMISSION_ATTRIBUTE

#if MC_VERSION < 12111
program.world-1/gbuffers_line.enabled=false
program.world0/gbuffers_line.enabled=false
program.world1/gbuffers_line.enabled=false
#endif

#if MC_VERSION < 11700 || !defined IS_IRIS || !defined ENABLE_SKY
program.world0/gbuffers_clouds.enabled=false
program.world0/gbuffers_skybasic.enabled=false
#endif