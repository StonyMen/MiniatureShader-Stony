#-------------------------------------------------------------------------------
# performance profiles
#
# a profile patches every option below - one left out would be inherited from
# whatever was selected before instead of being reset to a default
#
#                              LOW           MEDIUM        HIGH
#   shadowMapResolution        512           1024          2048
#   shadowDistance             64.0          128.0         256.0
#   SHADOW_ENTITY              -1 (none)     1 (all)       1 (all)
#   entityShadowDistanceMul    0.25          0.25          0.25
#   COLORED_SHADOWS            0 (none)      1 (grey)      2 (coloured)
#   HAND_DYNAMIC_LIGHTING      -1 (off)      0 (held)      0 (held)
#   BLOCK_REFLECTIONS          0 (off)       5             5
#   WATER_REFLECTION_STRENGTH  0 (off)       5             5
#   SSR_MAX_STEPS              4             10            20
#   SSR_STEP_SIZE              2.0           1.5           1.0
#   SSR_BINARY_STEPS           1             4             8
#
# MEDIUM is also what shader.h defaults to, so it is where a fresh install
# starts. shadows stay on in all three profiles, LOW only makes them cheaper;
# turn ENABLE_SHADOWS off to drop the pass entirely, and set both reflection
# options to 0 to skip the screen space trace.
#-------------------------------------------------------------------------------
profile.LOW=shadowMapResolution=512 shadowDistance=64.0 SHADOW_ENTITY=-1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=0 HAND_DYNAMIC_LIGHTING=-1 BLOCK_REFLECTIONS=0 WATER_REFLECTION_STRENGTH=0 SSR_MAX_STEPS=4 SSR_STEP_SIZE=2.0 SSR_BINARY_STEPS=1
profile.MEDIUM=shadowMapResolution=1024 shadowDistance=128.0 SHADOW_ENTITY=1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=1 HAND_DYNAMIC_LIGHTING=0 BLOCK_REFLECTIONS=5 WATER_REFLECTION_STRENGTH=5 SSR_MAX_STEPS=10 SSR_STEP_SIZE=1.5 SSR_BINARY_STEPS=4
profile.HIGH=shadowMapResolution=2048 shadowDistance=256.0 SHADOW_ENTITY=1 entityShadowDistanceMul=0.25 COLORED_SHADOWS=2 HAND_DYNAMIC_LIGHTING=0 BLOCK_REFLECTIONS=5 WATER_REFLECTION_STRENGTH=5 SSR_MAX_STEPS=20 SSR_STEP_SIZE=1.0 SSR_BINARY_STEPS=8

#-------------------------------------------------------------------------------
# settings menu layout
#
# <profile> sits alone at the top left, the five page buttons line up down the
# right column. every sub-screen is pinned to two columns, because Iris switches
# to three by itself when a page gets long. entries fill row-major, so a screen
# with a group on each side has to interleave them and pad the shorter side with
# <empty>
#-------------------------------------------------------------------------------
screen=<profile> [SHADOWS_SCREEN] <empty> [REFLECTIONS_SCREEN] <empty> [WATER_SCREEN] <empty> [ATMOSPHERE_SCREEN] <empty> [OTHER_SCREEN]

# light & shadow: lighting on the left, shadows on the right
screen.SHADOWS_SCREEN=LIGHT_BRIGHTNESS ENABLE_SHADOWS FLAT_LIGHTING COLORED_SHADOWS sunPathRotation SHADOW_ENTITY <empty> shadowDistance <empty> entityShadowDistanceMul <empty> shadowMapResolution <empty> SHADOW_PIXEL
screen.SHADOWS_SCREEN.columns=2

# reflections: default layout, Iris splits it by itself
screen.REFLECTIONS_SCREEN=WATER_REFLECTION_STRENGTH BLOCK_REFLECTIONS SSR_STEP_SIZE SSR_MAX_STEPS <empty> SSR_BINARY_STEPS

# water: brightness / opacity / colour on the left, waves / glint on the right
screen.WATER_SCREEN=WATER_BRIGHTNESS WATER_WAVE_SIZE WATER_A WATER_WAVE_SPEED WATER_SATURATION WATER_GLINT_CUTOFF <empty> WATER_MIN_GLINT <empty> WATER_GLINT_BRIGHTNESS
screen.WATER_SCREEN.columns=2

# environment: sky & clouds on the left, fog then end stars on the right
screen.ATMOSPHERE_SCREEN=ENABLE_SKY ENABLE_FOG WEATHER_OPACITY OVERWORLD_FOG_MIN_SLIDER CLOUD_LIGHT_GAIN OVERWORLD_FOG_MAX_SLIDER CLOUD_SILVER_LINING END_STARS_SPEED CLOUD_WEATHER_DARKNESS END_STARS_AMOUNT <empty> END_STARS_OPACITY
screen.ATMOSPHERE_SCREEN.columns=2

# other: single column, so no placeholder is needed
screen.OTHER_SCREEN=HAND_DYNAMIC_LIGHTING GLOWING_ORES NETHER_COLOR_GRADING END_PORTAL
screen.OTHER_SCREEN.columns=1

sliders=LIGHT_BRIGHTNESS WATER_BRIGHTNESS WATER_SATURATION WATER_A shadowDistance OVERWORLD_FOG_MIN_SLIDER OVERWORLD_FOG_MAX_SLIDER shadowMapResolution SHADOW_PIXEL WATER_REFLECTION_STRENGTH WATER_MIN_GLINT WATER_WAVE_SIZE WATER_WAVE_SPEED entityShadowDistanceMul sunPathRotation END_STARS_SPEED END_STARS_AMOUNT END_STARS_OPACITY WEATHER_OPACITY SSR_MAX_STEPS SSR_STEP_SIZE SSR_BINARY_STEPS BLOCK_REFLECTIONS WATER_GLINT_CUTOFF WATER_GLINT_BRIGHTNESS CLOUD_LIGHT_GAIN CLOUD_SILVER_LINING CLOUD_WEATHER_DARKNESS

oldHandLight=true
separateAo=true
beacon.beam.depth=true
rain.depth=false
particles.ordering=mixed
occlusion.culling=true
oldLighting=false

#if SHADOW_ENTITY >= 1 || (!defined IS_IRIS && SHADOW_ENTITY >= 0)
shadowEntities=true
shadowBlockEntities=true
#else
shadowEntities=false
shadowBlockEntities=false
#endif

#if SHADOW_ENTITY >= 0
shadowPlayer=true
#else
shadowPlayer=false
#endif

iris.features.optional=BLOCK_EMISSION_ATTRIBUTE

#if MC_VERSION < 12111
program.world-1/gbuffers_line.enabled=false
program.world0/gbuffers_line.enabled=false
program.world1/gbuffers_line.enabled=false
#endif

#if !defined IS_IRIS || !defined ENABLE_SKY
program.world0/gbuffers_clouds.enabled=false
program.world0/gbuffers_skybasic.enabled=false
program.world0/gbuffers_skytextured.enabled=false
#endif